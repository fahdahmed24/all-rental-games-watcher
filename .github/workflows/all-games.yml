name: All rental games watcher

on:
  schedule:
    # Check for new games and status changes every five minutes
    - cron: "*/5 * * * *"

    # Daily report at 1:00 PM Doha time
    # Doha is UTC+3, so this is 10:00 AM UTC
    - cron: "0 10 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-games:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Check for new games and status changes
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
        env:
          CHECK_MODE: check
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check_all_games.py

      - name: Send daily report
        if: github.event.schedule == '0 10 * * *'
        env:
          CHECK_MODE: daily
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check_all_games.py

      - name: Save game history
        if: always() && hashFiles('all_games_state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add all_games_state.json

          git diff --cached --quiet || git commit -m "Update all games state"

          git push
